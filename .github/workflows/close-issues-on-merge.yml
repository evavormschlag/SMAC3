name: Close-Issues-On-Merge

# GitHub only auto-closes issues referenced via keywords (e.g. "Fixes #123")
# when a PR is merged into the default branch (main). This workflow does the
# same for PRs merged into development.

# pull_request_target so the token can close issues for PRs from forks too.
# Safe here: no PR code is checked out and the body is only read via env.
on:
  pull_request_target:
    types: [closed]
    branches: [development]

permissions:
  issues: write
  pull-requests: read

jobs:
  close-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
    - name: Close referenced issues
      env:
        GH_TOKEN: ${{ github.token }}
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        # Skip quoted template lines (e.g. "> Example: Fixes #1234.")
        issues=$(echo "$PR_BODY" \
          | grep -v '^[[:space:]]*>' \
          | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]+#[0-9]+' \
          | grep -oE '[0-9]+' | sort -u)
        for issue in $issues; do
          echo "Closing #$issue"
          gh issue close "$issue" --repo "$REPO" \
            --comment "Closed by #$PR_NUMBER (merged into development)." || true
        done
